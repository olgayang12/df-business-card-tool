<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大豐環保 - 名片製作平台 (V5 最終版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 30px; color: #333; margin: 0; }
        .container { display: flex; gap: 40px; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 1400px; width: 100%; flex-wrap: wrap; }
        .left-panel { flex: 1; min-width: 350px; max-height: 90vh; overflow-y: auto; padding-right: 15px; }
        .right-panel { flex: 1.8; min-width: 500px; display: flex; flex-direction: column; }
        h2 { color: #005780; margin-top: 0; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0; }
        h3 { margin: 20px 0 10px 0; color: #333; background: #eee; padding: 8px; border-radius: 4px; font-size: 1rem; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #555; font-size: 0.85rem; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem; background: #fafafa; box-sizing: border-box; }
        input[type="text"]:focus { background: #fff; border-color: #005780; outline: none; }
        .preview-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .preview-box { flex: 1; min-width: 300px; }
        .preview-label { font-weight: bold; color: #005780; margin-bottom: 5px; display: block; }
        .svg-wrapper { width: 100%; line-height: 0; border: 1px solid #ccc; box-shadow: 0 5px 15px rgba(0,0,0,0.1); background: white; margin-bottom: 15px; }
        .svg-wrapper svg { width: 100% !important; height: auto !important; display: block; }
        details { margin-top: 10px; background: #f9f9f9; padding: 10px; border-radius: 5px; border: 1px solid #eee; }
        summary { font-size: 0.8rem; color: #888; cursor: pointer; }
        .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 0.8rem; }
        input[type="range"] { flex: 1; cursor: pointer; }
        .val-display { width: 40px; text-align: right; font-family: monospace; color: #005780; font-weight: bold;}
        .btn-group { display: flex; gap: 10px; margin-top: auto; }
        button { flex: 1; padding: 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; font-size: 1.1rem; transition: 0.2s;}
        button:hover { opacity: 0.9; }
        .btn-dl { background: #4caf50; }
        .btn-mail { background: #005780; }
        #qrcode { position: absolute; top: -9999px; left: -9999px; }
    </style>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <h2>📝 資料填寫</h2>
        
        <h3>🇹🇼 正面 (中文)</h3>
        <div class="form-group"><label>姓名</label><input type="text" id="inpName" value="黃奕儒" oninput="updateAll()"></div>
        <div class="form-group"><label>部門 (自動調整間距)</label><input type="text" id="inpDept" value="營運管理部" oninput="updateAll()"></div>
        <div class="form-group"><label>職稱</label><input type="text" id="inpTitle" value="襄理" oninput="updateAll()"></div>
        <div class="form-group"><label>手機</label><input type="text" id="inpMobile" value="0980 026 039" oninput="updateAll()"></div>
        <div class="form-group"><label>Email</label><input type="text" id="inpEmail" value="haha.huang@df-recycle.com" oninput="updateAll()"></div>
        <div class="form-group"><label>電話</label><input type="text" id="inpTel" value="(04) 2422 4266 ext.169" oninput="updateAll()"></div>
        <div class="form-group"><label>傳真</label><input type="text" id="inpFax" value="(04) 2422 0648" oninput="updateAll()"></div>

        <h3>🇺🇸 背面 (英文)</h3>
        <div class="form-group"><label>Name</label><input type="text" id="inpNameEn" value="Haha Huang" oninput="updateAll()"></div>
        <div class="form-group"><label>Dept</label><input type="text" id="inpDeptEn" value="Operations Management Dept." oninput="updateAll()"></div>
        <div class="form-group"><label>Title</label><input type="text" id="inpTitleEn" value="Junior Manager" oninput="updateAll()"></div>
        <div class="form-group"><label>Mobile</label><input type="text" id="inpMobileEn" value="+886 980 026 039" oninput="updateAll()"></div>
        <div class="form-group"><label>Tel</label><input type="text" id="inpTelEn" value="+886 (4) 2422 4266 ext.169" oninput="updateAll()"></div>
        <div class="form-group"><label>Fax</label><input type="text" id="inpFaxEn" value="+886 (4) 2422 0648" oninput="updateAll()"></div>

        <h3>🔗 QR Code</h3>
        <div class="form-group">
            <input type="text" id="inpQr" value="https://www.df-recycle.com" oninput="generateQR()">
            <details>
                <summary>⚙️ 位置微調</summary>
                <div class="slider-row"><label>大小</label><input type="range" id="qrSize" min="1" max="100" step="0.1" oninput="forceUpdateQR()"><span id="valSize" class="val-display"></span></div>
                <div class="slider-row"><label>X 軸</label><input type="range" id="qrX" min="0" max="200" step="0.1" oninput="forceUpdateQR()"><span id="valX" class="val-display"></span></div>
                <div class="slider-row"><label>Y 軸</label><input type="range" id="qrY" min="0" max="200" step="0.1" oninput="forceUpdateQR()"><span id="valY" class="val-display"></span></div>
                <button onclick="resetQRSettings()" style="margin-top:10px; padding:5px; width:100%; cursor:pointer;">重置回預設值</button>
            </details>
        </div>
    </div>

    <div class="right-panel">
        <h2>🖼️ 即時預覽</h2>
        <div class="preview-container">
            <div class="preview-box"><span class="preview-label">正面 (Front)</span><div id="previewFront" class="svg-wrapper"></div></div>
            <div class="preview-box"><span class="preview-label">背面 (Back)</span><div id="previewBack" class="svg-wrapper"></div></div>
        </div>
        <div style="margin-top:20px; font-size:0.85rem; color:#d32f2f; background:#ffebee; padding:10px; border-radius:5px;">
            ⚠️ <b>注意：</b>下載檔案為 RGB 格式。印刷前請用 Illustrator 開啟並轉為 <b>CMYK</b>。
        </div>
        <div class="btn-group">
            <button class="btn-dl" onclick="downloadAll()">1. 下載雙面檔案</button>
            <button class="btn-mail" onclick="sendMail()">2. 寄給 Olga</button>
        </div>
    </div>
</div>
<div id="qrcode"></div>

<script>
    const nsXlink = "http://www.w3.org/1999/xlink";
    const PRESET_QR = { size: 32.8, x: 28, y: 101.1 };

    const mapFront = {'inpName': 'field_name', 'inpDept': 'field_dept', 'inpTitle': 'field_title', 'inpMobile': 'field_mobile', 'inpEmail': 'field_email', 'inpTel': 'field_tel', 'inpFax': 'field_fax'};
    const mapBack = {'inpNameEn': 'field_name_en', 'inpDeptEn': 'field_dept_en', 'inpTitleEn': 'field_title_en', 'inpMobileEn': 'field_mobile_en', 'inpEmail': 'field_email_en', 'inpTelEn': 'field_tel_en', 'inpFaxEn': 'field_fax_en'};

    let qrDataUrl = null;

    window.onload = function() {
        resetQRSettings();
        loadSVG('svg-source-front', 'previewFront');
        loadSVG('svg-source-back', 'previewBack');
        updateAll();
        generateQR();
    };

    function loadSVG(sourceId, targetId) {
        const raw = document.getElementById(sourceId).innerHTML.trim();
        const target = document.getElementById(targetId);
        if(raw.length > 20 && !raw.includes("請刪除這行文字")) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(raw, "image/svg+xml");
            if (!doc.documentElement.getAttribute('xmlns:xlink')) doc.documentElement.setAttribute('xmlns:xlink', nsXlink);
            doc.documentElement.removeAttribute('width');
            doc.documentElement.removeAttribute('height');
            target.innerHTML = '';
            target.appendChild(doc.documentElement);
        } else {
            target.innerHTML = '<div style="padding:40px;text-align:center;color:#999;">(尚未載入 SVG)</div>';
        }
    }

    function resetQRSettings() {
        document.getElementById('qrSize').value = PRESET_QR.size;
        document.getElementById('qrX').value = PRESET_QR.x;
        document.getElementById('qrY').value = PRESET_QR.y;
        updateValDisplays();
        if(qrDataUrl) forceUpdateQR();
    }

    function updateValDisplays() {
        document.getElementById('valSize').textContent = document.getElementById('qrSize').value;
        document.getElementById('valX').textContent = document.getElementById('qrX').value;
        document.getElementById('valY').textContent = document.getElementById('qrY').value;
    }

    function updateAll() {
        updateFields(mapFront);
        updateFields(mapBack);
        
        // ★★★ 修正：只針對「正面 (中文)」做自動排版，背面不要動 ★★★
        setTimeout(() => {
            autoLayout('previewFront', 'field_dept', 'field_title');
            // autoLayout('previewBack', 'field_dept_en', 'field_title_en'); // 這行拿掉，英文就會乖乖回歸原位了
        }, 10);
    }

    function updateFields(map) {
        for (const [inputId, layerId] of Object.entries(map)) {
            const val = document.getElementById(inputId).value;
            const targets = findTextElements(layerId);
            targets.forEach(el => el.textContent = val);
        }
    }

    function findTextElements(layerId) {
        const els = document.querySelectorAll(`#${layerId}`);
        let results = [];
        els.forEach(el => {
            if (el.tagName === 'text' || el.tagName === 'tspan') {
                results.push(el);
            } else if (el.tagName === 'g') {
                const innerText = el.querySelector('text, tspan');
                if (innerText) results.push(innerText);
            }
        });
        return results;
    }

    function autoLayout(previewId, deptId, titleId) {
        const container = document.getElementById(previewId);
        if (!container) return;
        const deptGroup = container.querySelector(`#${deptId}`);
        const titleGroup = container.querySelector(`#${titleId}`);
        if (!deptGroup || !titleGroup) return;

        const deptTarget = (deptGroup.tagName === 'g' && !deptGroup.getAttribute('transform')) ? deptGroup.querySelector('text') : deptGroup;
        const titleTarget = (titleGroup.tagName === 'g' && !titleGroup.getAttribute('transform')) ? titleGroup.querySelector('text') : titleGroup;
        if (!deptTarget || !titleTarget) return;

        const deptTextNode = (deptGroup.tagName === 'text') ? deptGroup : deptGroup.querySelector('text');
        if (!deptTextNode) return;
        
        try {
            const deptWidth = deptTextNode.getComputedTextLength();
            let deptX = 0;
            const dTrans = deptTarget.getAttribute('transform');
            if (dTrans) {
                const match = /translate\(\s*([-\d.]+)/.exec(dTrans);
                if (match) deptX = parseFloat(match[1]);
            } else {
                deptX = parseFloat(deptTarget.getAttribute('x') || 0);
            }

            const gap = 5; 
            const newTitleX = deptX + deptWidth + gap;

            const tTrans = titleTarget.getAttribute('transform');
            if (tTrans) {
                const newTransform = tTrans.replace(/translate\(\s*([-\d.]+)/, `translate(${newTitleX}`);
                titleTarget.setAttribute('transform', newTransform);
            } else {
                titleTarget.setAttribute('x', newTitleX);
            }
        } catch (e) {}
    }

    function generateQR() {
        const url = document.getElementById('inpQr').value;
        const qrDiv = document.getElementById('qrcode');
        qrDiv.innerHTML = '';
        if(!url) return;
        new QRCode(qrDiv, { text: url, width: 512, height: 512 });
        setTimeout(() => {
            const canvas = qrDiv.querySelector('canvas');
            if(canvas) {
                qrDataUrl = canvas.toDataURL('image/png');
                forceUpdateQR();
            }
        }, 100);
    }

    function forceUpdateQR() {
        if(!qrDataUrl) return;
        const size = document.getElementById('qrSize').value;
        const x = document.getElementById('qrX').value;
        const y = document.getElementById('qrY').value;
        updateValDisplays();

        const svgFront = document.querySelector('#previewFront svg');
        if(svgFront) insertQR(svgFront, x, y, size);
        const svgBack = document.querySelector('#previewBack svg');
        if(svgBack) insertQR(svgBack, x, y, size);
    }

    function insertQR(svgElem, x, y, size) {
        let imgTag = svgElem.getElementById('inserted_qr_image');
        if(!imgTag) {
            imgTag = document.createElementNS("http://www.w3.org/2000/svg", "image");
            imgTag.setAttribute('id', 'inserted_qr_image');
            svgElem.appendChild(imgTag);
            const target = svgElem.getElementById('qr_target');
            if(target) target.style.display = 'none';
        }
        imgTag.setAttribute('x', x);
        imgTag.setAttribute('y', y);
        imgTag.setAttribute('width', size);
        imgTag.setAttribute('height', size);
        imgTag.setAttribute('href', qrDataUrl);
        imgTag.setAttributeNS(nsXlink, 'xlink:href', qrDataUrl);
    }

    function downloadOne(svgContainerId, suffix) {
        const container = document.getElementById(svgContainerId);
        if(!container || !container.querySelector('svg')) return;
        const svgEl = container.querySelector('svg');
        const serializer = new XMLSerializer();
        let source = serializer.serializeToString(svgEl);
        if(!source.includes('xmlns:xlink')) source = source.replace('<svg', '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
        
        const blob = new Blob([source], {type: "image/svg+xml;charset=utf-8"});
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const name = document.getElementById('inpName').value || '名片';
        link.href = url;
        link.download = `名片_${name}_${suffix}.svg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function downloadAll() {
        downloadOne('previewFront', '正面');
        setTimeout(() => { downloadOne('previewBack', '背面'); }, 500);
    }

    function sendMail() {
        const name = document.getElementById('inpName').value;
        const email = "olga.yang@df-recycle.com";
        const subject = encodeURIComponent(`【名片印製申請】${name}`);
        const body = encodeURIComponent(`Olga 您好：\n\n我是 ${name}，請協助印製名片。\n已附上 正面/背面 兩份 SVG 檔案，請查收。\n\n(⚠️ 檔案為 RGB 格式，印刷前請協助轉為 CMYK)`);
        window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
    }
    
    window.forceUpdateQR = forceUpdateQR;
    window.updateAll = updateAll;
    window.resetQRSettings = resetQRSettings;
</script>
